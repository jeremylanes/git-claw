[package]
name = "git-claw"
version = "0.3.3"
edition = "2021"
description = "Deterministic git worktree orchestration engine for developers and AI agents"
license = "GPL-2.0-or-later"
repository = "https://github.com/jeremylanes/git-claw"
homepage = "https://github.com/jeremylanes/git-claw"
readme = "README.md"
keywords = ["git", "worktree", "docker", "dx", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
fd-lock = "4.0"
colored = "2.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
