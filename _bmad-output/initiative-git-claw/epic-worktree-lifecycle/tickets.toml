# tickets.toml — epic-worktree-lifecycle child stories
# Managed by BMad Method. Order below is build order.

[[entry]]
id = 1
type = "story"
title = "Git worktree runner & branch creation primitives"
description = "Implements infra/worktree.rs invoking system git worktree add and branch creation for branch prefixes feature/, bugfix/, hotfix/, and spike/ with rollback on failure."
verify = "Integration test creates a Git worktree via the runner in a temporary test repository and confirms the directory and branch exist."
covers = ["FR-3"]
after = ["1.5"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = ".env.worktree generator & port environment injection"
description = "Implements infra/env.rs generating .env.worktree inside the created worktree, populating CLAW_SLOT_ID, CLAW_WORKTREE_NAME, CLAW_WORKTREE_PATH, COMPOSE_PROJECT_NAME, and all computed PORT_<KEY> variables."
verify = "Test verifies .env.worktree contents, variable syntax, and exact port offsets matching allocated slot."
covers = ["FR-3"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Shared cache linker (symlinks) & isolated mode flag"
description = "Implements infra/cache.rs creating symlinks from worktree paths to main repository paths for directories in shared_paths when cache.strategy = 'shared', and honors --isolated flag."
verify = "Test verifies created symlinks point to primary repo paths and ensures --isolated skips symlink creation."
covers = ["FR-3"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Lifecycle hooks runner (post_start, pre_finish, post_finish)"
description = "Implements infra/hooks.rs executing configured shell commands with .env.worktree variables injected. Implements warning-and-retain policy on post_start failure, and abort-unless-force policy on pre_finish failure."
verify = "Test confirms hook receives environment variables, non-zero pre_finish blocks completion, and post_start failure outputs warning without rolling back worktree."
covers = ["FR-3", "FR-4"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Worktree start workflow (git claw <type> start <name>)"
description = "Implements workflow/start.rs and CLI subcommands wiring slot acquisition, worktree creation, .env.worktree writing, cache symlinking, and post_start hook execution into an atomic end-to-end command."
verify = "End-to-end test runs git claw feature start my-feat, checks Slot ID 1 assigned, .env.worktree created, and branch checked out."
covers = ["FR-3"]
after = [1, 2, 3, 4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Worktree finish workflow (git claw finish [name])"
description = "Implements workflow/finish.rs executing pre_finish hooks, merging worktree branch into main, executing post_finish hooks, removing the worktree and branch, and releasing the Slot ID."
verify = "End-to-end test finishes an active worktree, merges commits to main, cleans up folder, and verifies Slot ID is freed in registry."
covers = ["FR-4"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Spike abandonment workflow (git claw spike drop <name>)"
description = "Implements workflow/spike.rs allowing deletion of a spike worktree without merging to main, bypassing finish hooks, and releasing the Slot ID."
verify = "End-to-end test creates a spike, drops it, and confirms worktree and branch are purged with no commits on main."
covers = ["FR-5"]
after = [5]
hitl = false
risk = "low"

[[entry]]
id = 8
type = "story"
title = "Remote worktree publish workflow (git claw [type] publish [name])"
description = "Implements workflow/publish.rs pushing worktree branches to remote with upstream tracking, matching Git Flow feature publish ergonomics."
verify = "Integration test creates a feature worktree, runs git claw feature publish, and confirms branch is pushed to a bare remote with tracking configured."
covers = ["FR-13"]
after = [5]
hitl = false
risk = "low"

[[entry]]
id = 9
type = "story"
title = "Remote branch teardown on finish (git claw finish [--keep-remote])"
description = "Extends workflow/finish.rs to automatically delete published remote branches upon completion unless --keep-remote is specified, matching Git Flow finish ergonomics."
verify = "Integration test finishes a published worktree and verifies the branch is deleted from a bare remote, and confirms --keep-remote retains the branch."
covers = ["FR-4", "FR-13"]
after = [8]
hitl = false
risk = "low"

[[entry]]
id = 10
type = "story"
title = "Shell auto-completion engine (git claw completion <shell>)"
description = "Integrates clap_complete to generate auto-completion scripts for Fish, Bash, Zsh, PowerShell, and Elvish, supporting both git-claw and git claw workflows."
verify = "Integration tests verify git claw completion <shell> for fish, bash, and zsh emit valid syntax containing completion rules."
covers = ["FR-14"]
after = [9]
hitl = false
risk = "low"

[[entry]]
id = 11
type = "story"
title = "Herdr multiplexer auto-activation (non-blocking worktree open)"
description = "Integrates infra/herdr.rs to automatically open newly created worktrees inside Herdr when HERDR_ENV=1 is detected, with strict test environment isolation (/tmp and test guards) and 100% graceful fallback when Herdr is absent."
verify = "Integration tests verify worktree creation succeeds without errors when HERDR_ENV is unset, tests never trigger Herdr, and real repositories under Herdr invoke herdr worktree open."
covers = ["FR-3", "FR-8", "FR-15"]
after = [10]
hitl = false
risk = "low"

[[entry]]
id = 12
type = "story"
title = "Cargo.toml version synchronization on release tag (git claw tag <version>)"
description = "Extends workflow/tag.rs to automatically synchronize package version in Cargo.toml and Cargo.lock when tagging a release, committing the version bump prior to creating the annotated tag."
verify = "Integration test runs git claw tag v0.3.0 in a repo containing Cargo.toml, confirms Cargo.toml version is updated, committed, and tagged on main."
covers = ["FR-9"]
after = [11]
hitl = false
risk = "low"





